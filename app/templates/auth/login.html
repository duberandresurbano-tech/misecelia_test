{% extends 'layouts/base.html' %}

{% block title %}Iniciar Sesión - Miscelia{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 75vh;">
    <div class="col-md-5">
        <div class="card shadow-sm border-0 p-4">

            <!-- Logo / Cabecera -->
            <div class="text-center mb-4">
                <div class="fs-1 text-primary">🏪</div>
                <h3 class="fw-bold mt-2">MISCELIA</h3>
                <p class="text-muted small">Sistema Local de Inventario y Ventas</p>
            </div>

            <!-- Formulario de Acceso -->
            <form method="POST" action="{{ url_for('auth.login') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                <div class="mb-3">
                    <label for="username" class="form-label fw-semibold text-secondary small">
                        👤 Usuario o Nombre de Acceso
                    </label>
                    <input type="text" class="form-control" id="username" name="username" placeholder="ej. admin" required autofocus>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label fw-semibold text-secondary small">
                        🔒 Contraseña
                    </label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="••••••••••••" required>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="py-2 btn btn-primary fw-bold">INICIAR SESIÓN</button>
                </div>
            </form>

        </div>
    </div>
</div>
{% endblock %}
